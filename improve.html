<html lang="kk">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="memory-themes.css"><link rel="stylesheet" href="memory-letters.css"><script src="background-music.js" defer></script></head>
  <body class="page-improve"><div class="noise" aria-hidden="true"></div>
    <main class="stage"><section class="card flow-card result-card">
      <p class="eyebrow">ОООУ НООООУ 😭</p><div class="mini-heart broken-heart" aria-hidden="true">💔</div>
      <h1>Сондай қатты ма?<br /><em>I’m so sorry…</em></h1>
      <p class="message">Сіздің жүрегіңізді қайта жаулап алу үшін не істей аламын? Маған айтыңызшы, өтінемін-өтінемін. Мен сізді шынымен тыңдағым келеді.</p>
      <form class="reply-form" id="replyForm" data-recipient="akiboupie">
        <label for="reply">Жауабыңызды осында жазыңыз:</label>
        <textarea id="reply" rows="4" placeholder="Менің қолымнан не келеді?.." required></textarea>
        <button class="btn btn-yes" type="submit">Жіберу ♡</button>
      </form>
      <p class="saved-note" id="savedNote" role="status" aria-live="polite"></p>
      <div class="reply-followup" id="replyFollowup" hidden>
        <a class="btn btn-yes" id="replyContinue" href="quiz.html?from=improve">Жалғастыру →</a>
        <button class="reply-edit" id="editReply" type="button">Жауапты өзгерту</button>
      </div>
    </section></main><script src="memory-letters.js"></script><script src="meadow.js"></script><script src="paper.js"></script><script src="improve.js"></script>
  </body>
